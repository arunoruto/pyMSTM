[project]
name = "pymstm"
version = "2.0.0"
description = "Python bindings for MSTM, the Multiple Sphere T-Matrix code: light scattering by clusters of spheres"
readme = "README.md"
# cp39 and cp310 builds crashed (in a solve, and in numpy's f2py), so the
# floor matches the wheels (cp311-cp314, [tool.cibuildwheel]).
requires-python = ">=3.11"
# The extension is MIT (pyMSTM, MSTM); the Linux wheels also bundle the GNU
# Fortran runtime (libgfortran, libquadmath). See LICENSES/.
license = "MIT AND GPL-3.0-or-later WITH GCC-exception-3.1 AND LGPL-2.1-or-later"
license-files = ["LICENSE", "LICENSES/*"]
authors = [{ name = "Mirza Arnaut", email = "mirza.arnaut@tu-dortmund.de" }]
keywords = [
  "t-matrix", "mstm", "multiple scattering", "light scattering",
  "electromagnetic scattering", "mie", "optics", "sphere clusters",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Fortran",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "numpy>=1.25",
  "pydantic>=2.0",
]

[project.optional-dependencies]
# run_dask(); MstmTask/solve_task need nothing extra.
dask = ["distributed>=2024.1"]

[project.urls]
Repository = "https://github.com/arunoruto/pyMSTM"
Issues = "https://github.com/arunoruto/pyMSTM/issues"
Changelog = "https://github.com/arunoruto/pyMSTM/blob/main/CHANGELOG.md"
"MSTM upstream" = "https://github.com/dmckwski/MSTM"

[dependency-groups]
# meson, ninja and meson-python are here as well as in build-system.requires
# because pymstm is built without isolation ([tool.uv] below), in this
# virtual environment.
dev = ["pytest>=7", "pytest-cov", "meson>=1.1", "ninja", "meson-python>=0.18"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
exclude = [".venv"]
venvPath = "."
venv = ".venv"

[tool.semantic_release]
# Releases are made by .github/workflows/publish.yml.
version_toml = ["pyproject.toml:project.version"]
major_on_zero = false
commit_message = "chore(release): v{version}\n\nAutomatically generated by python-semantic-release"
# No build_command: the wheels and sdist are built from the release tag by
# wheels.yml. Nor `uv lock` to bump pymstm's own entry in uv.lock: the
# action's container has neither uv nor gfortran, and uv may need to run
# the meson build backend; that entry trailing one release is harmless.

[tool.semantic_release.branches.main]
match = "main"

[tool.semantic_release.commit_parser_options]
allowed_tags = [
  "feat", "fix", "perf", "refactor", "docs", "test", "build", "ci", "chore",
  "style", "revert",
]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]

[tool.semantic_release.changelog]
# Inserts each release's entry below the `<!-- version list -->` marker
# and leaves the rest of CHANGELOG.md as written (see its header).
mode = "update"
exclude_commit_patterns = ['Merge pull request #\d+', 'chore\(release\):']

# --- cibuildwheel: how the published wheels are built ---
#
# Here rather than as CIBW_* variables in wheels.yml, so the same build
# runs locally with the `cibuildwheel` CLI.
[tool.cibuildwheel]
# Matches requires-python. musllinux is not built.
build = "cp311-* cp312-* cp313-* cp314-*"
skip = "*-musllinux*"
build-verbosity = 1
# Installs the built wheel and runs a two-sphere solve with it (a bare
# import would not catch a mislinked or miscompiled extension).
test-command = "python {project}/tools/wheel_smoke_test.py"

[tool.cibuildwheel.linux]
# The default manylinux2014 image (CentOS 7, GCC 10) builds an extension
# that segfaults in a two-sphere solve; manylinux_2_28 (AlmaLinux 8) works,
# and is what NumPy uses too.
manylinux-x86_64-image = "manylinux_2_28"
# Linux x86_64 wheels only.
archs = ["x86_64"]
before-all = "yum install -y gcc-gfortran"

[tool.uv]
# meson-python's editable-install loader hardcodes the absolute path to
# `ninja` (and the meson build dir) that it saw *during the build* into
# `_pymstm_editable_loader.py`, and reuses that exact path on every
# subsequent `import pymstm` to auto-rebuild the extension if sources
# changed. If pymstm is built in `uv`'s default *isolated* build
# environment, that environment (and the ninja binary in it) is deleted
# right after the build finishes, so every later import fails with
# "No such file or directory: .../ninja". Building without isolation
# instead means the build happens in this project's own persistent venv
# (which has meson/ninja via the `dev` group above), so the recorded path
# stays valid for the life of the venv.
no-build-isolation-package = ["pymstm"]

[build-system]
# meson-python drives meson.build, which in turn shells out to
# `numpy.f2py -c` (see tools/build_f2py_ext.py) to build the _mstm_ext
# extension -- gfortran, meson, ninja, and numpy must be available
# *before* pymstm itself is built (see [tool.uv] no-build-isolation-package
# above) -- meson/ninja come from the `dev` group, numpy from the runtime
# dependencies, gfortran from the devenv/nix shell.
requires = ["meson-python>=0.18", "numpy>=1.25"]
build-backend = "mesonpy"
