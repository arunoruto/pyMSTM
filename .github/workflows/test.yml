name: Testing

# The test suite, including the cross-checks against MSTM's own
# command-line program, built from the same december2023 sources
# (`make cli` -> build/mstm).

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "tools/**"
      - "external/**"
      - "meson.build"
      - "Makefile"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/test.yml"

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  unittest:
    name: PyTest
    runs-on: ubuntu-latest
    env:
      PYMSTM_MSTM_BIN: ${{ github.workspace }}/build/mstm
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install gfortran
        # `uv sync` builds the f2py extension (meson-python runs numpy.f2py
        # against external/mstm, see meson.build).
        run: sudo apt-get update && sudo apt-get install -y gfortran

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: Install dependencies (builds the f2py extension)
        run: uv sync --extra dev --extra dask

      - name: Cache the MSTM CLI
        id: cache-cli
        uses: actions/cache@v4
        with:
          path: build/mstm
          key: ${{ runner.os }}-mstm-cli-${{ hashFiles('external/mstm/december2023/**', 'Makefile') }}

      - name: Build the MSTM CLI
        # Without it the cross-checks against the CLI skip themselves.
        if: steps.cache-cli.outputs.cache-hit != 'true'
        run: make cli

      - name: Run the tests
        run: uv run pytest -v -rs
